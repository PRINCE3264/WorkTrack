<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkTrack – Login</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d28d9'/%3E%3Cpath d='M8 11h4l2 7 2-7h4' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M18 11l3 10 3-10' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: #f4f3fb;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated Background Blobs */
    .bg-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(110px);
      opacity: 0.18;
      animation: blobFloat 8s ease-in-out infinite alternate;
    }
    .blob1 { width: 520px; height: 520px; background: #7c3aed; top: -160px; left: -160px; animation-duration: 9s; }
    .blob2 { width: 400px; height: 400px; background: #6d28d9; bottom: -120px; right: -100px; animation-duration: 11s; animation-delay: -3s; }
    .blob3 { width: 260px; height: 260px; background: #818cf8; top: 40%; left: 60%; animation-duration: 7s; animation-delay: -1.5s; }

    @keyframes blobFloat {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(30px,20px) scale(1.08); }
    }

    /* Floating Particles */
    .particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .particle {
      position: absolute;
      width: 3px; height: 3px;
      background: rgba(109,40,217,0.25);
      border-radius: 50%;
      animation: particleDrift linear infinite;
    }
    @keyframes particleDrift {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.5; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* Card */
    .login-card {
      position: relative; z-index: 10;
      width: 100%; max-width: 430px; margin: 20px;
      background: #ffffff;
      border: 1px solid #e8e3f5;
      border-radius: 24px;
      padding: 44px 40px;
      box-shadow: 0 20px 60px rgba(109,40,217,0.1), 0 4px 16px rgba(0,0,0,0.06);
      animation: cardIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Logo */
    .logo-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
    .logo-icon-box {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 20px rgba(109,40,217,0.5);
      flex-shrink: 0;
    }
    .logo-icon-box svg { width: 26px; height: 26px; }
    .logo-name { font-size: 1.55rem; font-weight: 800; color: #1a1035; letter-spacing: -0.5px; }
    .logo-name span { background: linear-gradient(90deg,#7c3aed,#4f46e5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .login-heading { font-size: 1.45rem; font-weight: 700; color: #1a1035; margin-bottom: 6px; }
    .login-sub { font-size: 0.88rem; color: #6b5fa0; margin-bottom: 32px; }

    /* Form */
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 0.82rem; font-weight: 600; color: #5c536b; margin-bottom: 8px; letter-spacing: 0.3px; }
    .input-wrap { position: relative; }
    .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #a099af; pointer-events: none; display: flex; }
    .input-icon svg { width: 18px; height: 18px; }

    .form-input {
      width: 100%; padding: 13px 16px 13px 44px;
      background: #faf9fc;
      border: 1px solid #e2dceb;
      border-radius: 12px;
      font-family: 'Inter', sans-serif; font-size: 0.92rem; color: #1a1035;
      transition: all 0.25s; outline: none;
    }
    .form-input::placeholder { color: #b0a8c0; }
    .form-input:focus { background: #ffffff; border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,0.12); }

    .toggle-pass {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: #a099af; display: flex; transition: color 0.2s; padding: 0;
    }
    .toggle-pass:hover { color: #5c536b; }
    .toggle-pass svg { width: 18px; height: 18px; }

    /* Error */
    .error-msg {
      display: none;
      background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.35);
      color: #fca5a5; border-radius: 10px; padding: 11px 14px; font-size: 0.84rem; margin-bottom: 18px;
      animation: shake 0.4s ease;
    }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 60%{transform:translateX(6px)} }

    /* Button */
    .login-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #fff; border: none; border-radius: 12px;
      font-family: 'Inter', sans-serif; font-size: 0.98rem; font-weight: 700;
      cursor: pointer; transition: all 0.25s;
      box-shadow: 0 8px 24px rgba(109,40,217,0.4);
      margin-top: 6px; letter-spacing: 0.2px; position: relative; overflow: hidden;
    }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(109,40,217,0.55); }
    .login-btn:active { transform: translateY(0); }
    .login-btn.loading { pointer-events: none; opacity: 0.8; }

    .btn-spinner {
      display: none; width: 18px; height: 18px; margin: 0 auto;
      border: 2.5px solid rgba(255,255,255,0.35); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Hint */
    .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0 14px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #ede8f5; }
    .divider span { font-size: 0.75rem; color: #a099af; white-space: nowrap; }

    .hint-creds { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .hint-badge {
      background: #f4f0fc; border: 1px solid #e2dceb;
      border-radius: 8px; padding: 6px 14px; font-size: 0.75rem; color: #6b5fa0;
      cursor: pointer; transition: all 0.2s;
    }
    .hint-badge:hover { background: rgba(124,58,237,0.1); border-color: #7c3aed; color: #7c3aed; }

    .login-footer { text-align: center; margin-top: 22px; font-size: 0.75rem; color: #b0a8c0; }
  </style>
</head>
<body>

  <div class="bg-blob blob1"></div>
  <div class="bg-blob blob2"></div>
  <div class="bg-blob blob3"></div>
  <div class="particles" id="particles"></div>

  <div class="login-card">

    <div class="logo-wrap">
      <div class="logo-icon-box">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 10h5l3 9 3-9h5" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M20 10l4 12 4-12" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="logo-name">Work<span>Track</span></div>
    </div>

    <h1 class="login-heading">Welcome back 👋</h1>
    <p class="login-sub">Sign in to access your dashboard</p>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm" autocomplete="off">

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"/></svg>
          </span>
          <input type="text" id="username" class="form-input" placeholder="Enter your username" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="2"/></svg>
          </span>
          <input type="password" id="password" class="form-input" placeholder="Enter your password" />
          <button type="button" class="toggle-pass" id="togglePass">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        <span id="btnText">Sign In</span>
        <div class="btn-spinner" id="btnSpinner"></div>
      </button>
    </form>


    <p class="login-footer">WorkTrack · Envision Beyond India Pvt Ltd &copy; 2026</p>
  </div>

  <script>
  $(function () {

    /* Particles */
    for (var k = 0; k < 28; k++) {
      var size = Math.random() * 3 + 2;
      $('<div class="particle">').css({
        width: size, height: size,
        left: (Math.random() * 100) + '%',
        animationDuration: (Math.random() * 10 + 8) + 's',
        animationDelay: (Math.random() * 14) + 's'
      }).appendTo('#particles');
    }

    /* Quick-fill badges */
    $('.cred-fill').on('click', function () {
      $('#username').val($(this).data('u'));
      $('#password').val($(this).data('p'));
      $('#password').focus();
    });

    /* Show/hide password */
    $('#togglePass').on('click', function () {
      var $in = $('#password');
      var show = $in.attr('type') === 'password';
      $in.attr('type', show ? 'text' : 'password');
      $('#eyeIcon').html(show
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" stroke="currentColor" stroke-width="2"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" stroke="currentColor" stroke-width="2"/><line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>'
      );
    });

    /* Credentials — only ONE login allowed */
    var USERS = {
      admin: 'admin@123'
    };

    /* Login */
    $('#loginForm').on('submit', function (e) {
      e.preventDefault();
      var user = $.trim($('#username').val()).toLowerCase();
      var pass = $.trim($('#password').val());

      $('#errorMsg').hide();

      if (!user || !pass) {
        $('#errorMsg').text('Please enter both username and password.').show();
        return;
      }

      $('#btnText').hide();
      $('#btnSpinner').show();
      $('#loginBtn').addClass('loading');

      setTimeout(function () {
        if (USERS[user] && USERS[user] === pass) {
          sessionStorage.setItem('wt_auth', '1');
          sessionStorage.setItem('wt_user', user);
          window.location.href = 'index.html';
        } else {
          $('#btnText').show();
          $('#btnSpinner').hide();
          $('#loginBtn').removeClass('loading');
          $('#errorMsg').text('Invalid username or password. Please try again.').show();
          $('#password').val('').focus();
        }
      }, 800);
    });

  });
  </script>
</body>
</html>
